<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Futbol Ehtimalları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f5f1; --surface: #ffffff; --surface-2: #eceee8; --line: #dcdfd6;
  --fg: #171a14; --muted: #646b5d; --accent: #1f7a3d; --accent-ink: #ffffff; --accent-soft: #dff0e3;
  --gold: #a86f00; --gold-soft: #fbefd2; --bad: #c2362b; --bad-soft: #f9e0dd; --info: #2b5fb4;
  --shadow: 0 1px 2px rgba(20,30,10,.06), 0 4px 14px rgba(20,30,10,.05);
  --f-display: "Archivo", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111410; --surface: #1a1e18; --surface-2: #242a21; --line: #333a2f;
  --fg: #eef1ea; --muted: #9ba493; --accent: #4cc472; --accent-ink: #0b1a0f; --accent-soft: #19301f;
  --gold: #e9b44c; --gold-soft: #33290f; --bad: #ef7466; --bad-soft: #3d1f1b; --info: #7aa7f0;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111410; --surface: #1a1e18; --surface-2: #242a21; --line: #333a2f;
  --fg: #eef1ea; --muted: #9ba493; --accent: #4cc472; --accent-ink: #0b1a0f; --accent-soft: #19301f;
  --gold: #e9b44c; --gold-soft: #33290f; --bad: #ef7466; --bad-soft: #3d1f1b; --info: #7aa7f0;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)) }
header { padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 12px }
h1 { font: 800 24px/1.1 var(--f-display); margin: 0; letter-spacing: -.01em }
h1 small { display: block; font: 500 12px var(--f-body); color: var(--muted); margin-top: 4px; letter-spacing: 0 }
h2 { font: 800 18px/1.25 var(--f-display); margin: 0 0 8px }
h3 { font: 600 14px/1.3 var(--f-body); margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: 11.5px }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 8px 10px; font: 500 13px var(--f-body); cursor: pointer }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line) }
nav.tabs .wrap { display: flex; gap: 4px; padding-block: 8px }
nav.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--f-body); padding: 9px 6px; border-radius: 10px; cursor: pointer }
nav.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg) }
main { padding-block: 14px 80px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 8px 12px; font: 500 13.5px var(--f-body); cursor: pointer }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
input[type=search], input[type=text], input[type=number], input[type=password] { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: 15px var(--f-body); min-width: 0; width: 100% }
input[type=number] { font-family: var(--f-mono) }
button.primary, a.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 11px 16px; font: 600 14.5px var(--f-body); cursor: pointer; text-decoration: none; display: inline-block }
button.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 13px; font: 500 13.5px var(--f-body); cursor: pointer }
button:disabled { opacity: .5; cursor: default }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.note { background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px }
.err { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px }

.fx-list { display: grid; gap: 6px }
.fx { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; color: var(--fg); font: inherit; width: 100% }
.fx:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)) }
.fx .t { font: 600 13px var(--f-mono); color: var(--muted) }
.fx .teams { font-weight: 600; overflow: hidden; text-overflow: ellipsis }
.fx .lg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fx .tag { font: 500 11.5px var(--f-mono); color: var(--accent); white-space: nowrap }
.lg-h { font: 600 12px var(--f-body); color: var(--muted); margin: 14px 2px 4px; display: flex; gap: 6px; align-items: center }
.lg-h img { width: 16px; height: 16px; object-fit: contain }

.match-h { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; margin: 4px 0 12px }
.match-h .tm { font: 700 16px/1.25 var(--f-display) }
.match-h img { width: 40px; height: 40px; object-fit: contain; display: block; margin: 0 auto 6px }
.match-h .vs { font: 500 12px var(--f-mono); color: var(--muted) }
.picks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.pick { border-radius: 12px; padding: 12px; border: 1px solid var(--line); background: var(--surface-2) }
.pick.main { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)) }
.pick .lbl { font: 600 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.pick .sel { font: 700 17px/1.25 var(--f-display); margin: 4px 0 6px }
.pick .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 12.5px var(--f-mono); color: var(--muted) }
.pick .nums b { color: var(--fg); font-weight: 500 }
.pbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px }
.pbar i { display: block; height: 100%; background: var(--accent) }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font: 600 11px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 6px; border-bottom: 1px solid var(--line) }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
tr.grp td { background: var(--surface-2); font: 600 12px var(--f-body); color: var(--muted); padding-block: 5px }
.ev-pos { color: var(--accent); font-weight: 600 }
.ev-neg { color: var(--muted) }
.scores { display: flex; flex-wrap: wrap; gap: 6px }
.scores span { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: 13px var(--f-mono) }
.calc { display: grid; grid-template-columns: 1fr 110px; gap: 8px; align-items: center }
select { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px; font: 14px var(--f-body); min-width: 0; width: 100% }

.legs { display: grid; gap: 6px }
.leg { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--surface) }
.leg .i { font: 500 12px var(--f-mono); color: var(--muted); text-align: center }
.leg .s { font-weight: 600 }
.leg .m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.leg .r { text-align: right; font: 12.5px var(--f-mono); white-space: nowrap }
.leg .r b { font-size: 14px }
.leg[data-res="won"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft) }
.leg[data-res="lost"] { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: var(--bad-soft) }
.leg[data-res="void"] { opacity: .6 }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px }
.kpi .v { font: 700 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums }
.kpi .k { font-size: 12px; color: var(--muted); margin-top: 3px }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 }
.params label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 6px 11px; font: 500 12.5px var(--f-body); cursor: pointer }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.prog { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s }
.lg-pick { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; background: var(--surface) }
.lg-pick label { display: flex; gap: 8px; align-items: center; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--line) }
.lg-pick label:last-child { border-bottom: 0 }
.lg-pick .c { margin-left: auto; color: var(--muted); font: 12px var(--f-mono) }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px) }
.hist-item { margin-bottom: 10px }
.hist-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px }
.res-btns { display: inline-flex; gap: 4px }
.res-btns button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 3px 7px; font: 12px var(--f-body); cursor: pointer }
.badge { font: 600 11.5px var(--f-body); border-radius: 99px; padding: 3px 9px; white-space: nowrap }
.badge.won { background: var(--accent-soft); color: var(--accent) }
.badge.lost { background: var(--bad-soft); color: var(--bad) }
.badge.pending { background: var(--surface-2); color: var(--muted) }
@media (max-width: 520px) {
  .fx { grid-template-columns: 44px minmax(0,1fr) }
  .fx .tag { grid-column: 2 }
  td, th { padding-inline: 4px }
  .hide-sm { display: none }
}
</style>
</head>
<body>
<header class="wrap">
  <h1>Futbol ehtimalları<small id="quota">Bu gün: 0 / 100 sorğu</small></h1>
  <button class="icon-btn" id="setBtn" type="button">Açar</button>
</header>
<nav class="tabs"><div class="wrap" role="tablist">
  <button role="tab" data-tab="match" aria-selected="true">Oyun</button>
  <button role="tab" data-tab="coupon" aria-selected="false">Kupon</button>
  <button role="tab" data-tab="hist" aria-selected="false">Tarixçə</button>
</div></nav>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* Odds-based football probabilities (API-Football, free plan).
   Probability = bookmaker odds with the margin removed: Pinnacle when it prices the market, otherwise the median of all books.
   Free-plan limits handled here: only yesterday..tomorrow, 10 requests/min, 100/day, odds per fixture. */
const API = "https://v3.football.api-sports.io";
const TZ = "Asia/Baku";
const LS = { key: "fe-key", hist: "fe-hist", quota: "fe-quota", cache: "fe-c:", prefs: "fe-prefs" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pct = p => (p * 100).toFixed(p >= 0.995 || p < 0.1 ? 1 : 0) + "%";
const odd = o => o == null ? "–" : o.toFixed(2);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(t, ms = 2600) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }

// ---------- dates (Baku) ----------
function bakuDate(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 864e5);
  return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
}
// The free plan accepts dates from yesterday to tomorrow in UTC, so between 00:00 and 04:00 in Baku "tomorrow" is not yet available.
const utcDate = off => new Date(Date.now() + off * 864e5).toISOString().slice(0, 10);
const dateAllowed = d => d >= utcDate(-1) && d <= utcDate(1);
const hm = ts => new Intl.DateTimeFormat("az", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(new Date(ts * 1000));
const AY = ["yan", "fev", "mar", "apr", "may", "iyn", "iyl", "avq", "sen", "okt", "noy", "dek"];
const dm = ts => { const [y, mo, d] = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ts * 1000)).split("-"); return +d + " " + AY[+mo - 1]; };

// ---------- API with throttling + caching ----------
const getKey = () => ls.get(LS.key, "");
let calls = [];
function quota() { const q = ls.get(LS.quota, {}); const day = new Date().toISOString().slice(0, 10); return q.day === day ? q : { day, n: 0 }; }
function bumpQuota() { const q = quota(); q.n++; ls.set(LS.quota, q); showQuota(); }
function showQuota() { const q = quota(); $("#quota").textContent = "Bu gün: " + q.n + " / 100 sorğu"; }
class ApiError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }

async function api(path, onWait) {
  const key = getKey(); if (!key) throw new ApiError("nokey");
  for (let attempt = 0; attempt < 4; attempt++) {
    for (;;) { // stay under 10 requests per rolling minute
      const now = Date.now(); calls = calls.filter(t => now - t < 61000);
      if (calls.length < 9) break;
      const wait = 61000 - (now - calls[0]) + 300; onWait && onWait(wait); await sleep(wait);
    }
    calls.push(Date.now()); bumpQuota();
    let res;
    try { res = await fetch(API + path, { headers: { "x-apisports-key": key } }); }
    catch (e) { if (!navigator.onLine) throw new ApiError("offline"); onWait && onWait(8000); await sleep(8000); continue; } // a 429 arrives without CORS headers
    if (res.status === 429) { onWait && onWait(8000); await sleep(8000); continue; }
    if (!res.ok) throw new ApiError("http", "Server xətası " + res.status);
    const d = await res.json();
    const e = d.errors && !Array.isArray(d.errors) ? d.errors : {};
    if (e.rateLimit) { onWait && onWait(8000); await sleep(8000); continue; }
    if (e.token) throw new ApiError("badkey");
    if (e.access) throw new ApiError("suspended");
    if (e.requests) throw new ApiError("quota");
    if (e.plan) throw new ApiError("plan", e.plan);
    if (Object.keys(e).length) throw new ApiError("api", Object.values(e).join("; "));
    return d;
  }
  throw new ApiError("busy");
}
function errText(e) {
  return ({ nokey: "API açarı yoxdur. Yuxarıda «Açar» düyməsini basın.",
            badkey: "API açarı səhvdir. «Açar» düyməsindən yenidən yazın.",
            quota: "Bu günün 100 sorğusu bitib. Limit hər gün saat 04:00-da (Bakı) yenilənir.",
            offline: "İnternet yoxdur.",
            suspended: "API-Football hesabınız dayandırılıb. dashboard.api-football.com-a baxın və ya support@api-football.com-a yazın.",
            busy: "Server məşğuldur, bir dəqiqə sonra yenidən yoxlayın.",
            plan: "Pulsuz plan bu tarixə icazə vermir (yalnız dünən, bu gün, sabah)." }[e.code]) || ("Xəta: " + (e.message || e));
}
function cacheGet(k, ttlMin) { const c = ls.get(LS.cache + k); return c && Date.now() - c.t < ttlMin * 6e4 ? c.v : null; }
function cacheSet(k, v) {
  if (ls.set(LS.cache + k, { t: Date.now(), v })) return;
  try { Object.keys(localStorage).filter(x => x.startsWith(LS.cache)).forEach(x => localStorage.removeItem(x)); } catch (e) {} // full: drop all cache
  ls.set(LS.cache + k, { t: Date.now(), v });
}
function pruneCache() {
  try { for (const k of Object.keys(localStorage)) if (k.startsWith(LS.cache)) { const c = ls.get(k); if (!c || Date.now() - c.t > 2 * 864e5) localStorage.removeItem(k); } } catch (e) {}
}

async function fixtures(date, force) {
  const ck = "fx:" + date; const c = !force && cacheGet(ck, 20); if (c) return c;
  const d = await api("/fixtures?date=" + date + "&timezone=" + TZ);
  const v = d.response.map(r => ({ id: r.fixture.id, ts: r.fixture.timestamp, st: r.fixture.status.short,
    lg: { id: r.league.id, n: r.league.name, c: r.league.country, logo: r.league.logo, r: r.league.round },
    h: { id: r.teams.home.id, n: r.teams.home.name, logo: r.teams.home.logo }, a: { id: r.teams.away.id, n: r.teams.away.name, logo: r.teams.away.logo },
    ft: r.score && r.score.fulltime ? [r.score.fulltime.home, r.score.fulltime.away] : null, g: [r.goals.home, r.goals.away] }));
  cacheSet(ck, v); return v;
}
// compact odds: {bk: {name: {x:[h,d,a], dc:[1X,12,X2], ou:{"2.5":[o,u]}, bt:[yes,no]}}}
function parseOdds(resp) {
  const bk = {};
  for (const b of (resp.bookmakers || [])) {
    const o = {};
    for (const bet of b.bets) {
      const v = Object.fromEntries(bet.values.map(x => [String(x.value), parseFloat(x.odd)]));
      if (bet.id === 1 && v.Home && v.Draw && v.Away) o.x = [v.Home, v.Draw, v.Away];
      else if (bet.id === 12 && v["Home/Draw"] && v["Home/Away"] && v["Draw/Away"]) o.dc = [v["Home/Draw"], v["Home/Away"], v["Draw/Away"]];
      else if (bet.id === 8 && v.Yes && v.No) o.bt = [v.Yes, v.No];
      else if (bet.id === 5) { o.ou = {}; for (const L of ["0.5","1.5","2.5","3.5","4.5"]) if (v["Over " + L] && v["Under " + L]) o.ou[L] = [v["Over " + L], v["Under " + L]]; }
    }
    if (Object.keys(o).length) bk[b.name] = o;
  }
  return bk;
}
async function oddsFor(fid, onWait, force) {
  const ck = "od:" + fid; const c = !force && cacheGet(ck, 90); if (c) return c;
  const d = await api("/odds?fixture=" + fid, onWait);
  const v = d.response.length ? parseOdds(d.response[0]) : {};
  cacheSet(ck, v); return v;
}

// ---------- model ----------
const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const devig = arr => { const inv = arr.map(o => 1 / o); const s = inv.reduce((a, b) => a + b, 0); return inv.map(x => x / s); };
function fairFrom(books, get) { // -> {p:[..], src, n}
  const pin = books.Pinnacle && get(books.Pinnacle);
  const all = Object.values(books).map(get).filter(Boolean);
  if (!all.length) return null;
  if (pin) return { p: devig(pin), src: "Pinnacle", n: all.length };
  const dv = all.map(devig); const p = dv[0].map((_, i) => median(dv.map(x => x[i]))); const s = p.reduce((a, b) => a + b, 0);
  return { p: p.map(x => x / s), src: "median", n: all.length };
}

}

  const bind = (id, k) => { const el = $(id); el.value = prefs[k]; el.onchange = () => { const v = parseFloat(String(el.value).replace(",", ".")); if (v > 0) { prefs[k] = k === "legs" ? Math.round(v) : v; savePrefs(); build(); } }; };
  bind("#pLegs", "legs"); bind("#pMin", "minO"); bind("#pMax", "maxO"); bind("#pStake", "stake");
  const MK = ["1X2", "İkiqat şans", "Qollar (alt/üst)", "Hər iki komanda qol vurar"];
  $("#mk").innerHTML = MK.map(k => `<button class="chip" type="button" data-k="${esc(k)}" aria-pressed="${prefs.mk.includes(k)}">${esc(k)}</button>`).join("");
  $("#mk").querySelectorAll("button").forEach(b => b.onclick = () => { const k = b.dataset.k; prefs.mk = prefs.mk.includes(k) ? prefs.mk.filter(x => x !== k) : [...prefs.mk, k]; b.setAttribute("aria-pressed", prefs.mk.includes(k)); savePrefs(); build(); });

  let all = [];
  const blocked = days().filter(d => !dateAllowed(bakuDate(d)));
  if (blocked.length === days().length) { $("#lgBox").innerHTML = `<div class="note">Sabahın oyunları pulsuz planda Bakı vaxtı ilə saat 04:00-dan sonra açılır. «Bu gün» seçin.</div>`; return; }
  try { for (const d of days()) if (dateAllowed(bakuDate(d))) all = all.concat(await fixtures(bakuDate(d))); }
  catch (e) { $("#lgBox").innerHTML = `<div class="err">${esc(errText(e))}</div>`; return; }
  const soon = Date.now() / 1000 + 10 * 60;
  const open = all.filter(f => (f.st === "NS" || f.st === "TBD") && f.ts > soon && !isYouthOrWomen(f));
  const byLg = new Map(); for (const f of open) { const k = f.lg.id; if (!byLg.has(k)) byLg.set(k, { lg: f.lg, fx: [] }); byLg.get(k).fx.push(f); }
  const lgs = [...byLg.values()].sort((a, b) => lgRank(a.fx[0]) - lgRank(b.fx[0]) || b.fx.length - a.fx.length);
  if (!coupon.leagues) { // default: priority leagues, topped up with the busiest others to ~40 fixtures
    const sel = new Set(); let n = 0;
    for (const l of lgs) if (PRIORITY.has(l.lg.id)) { sel.add(l.lg.id); n += l.fx.length; }
    for (const l of lgs) { if (n >= 40) break; if (!sel.has(l.lg.id)) { sel.add(l.lg.id); n += l.fx.length; } }
    coupon.leagues = sel;
  }
  const drawLg = () => {
    $("#lgBox").innerHTML = `<div class="row" style="margin-bottom:6px"><button class="ghost" id="lgAll" type="button">Hamısı</button><button class="ghost" id="lgNone" type="button">Heç biri</button></div>
      <div class="lg-pick">${lgs.map(l => `<label><input type="checkbox" data-id="${l.lg.id}"${coupon.leagues.has(l.lg.id) ? " checked" : ""}> ${esc(l.lg.c)} · ${esc(l.lg.n)}<span class="c">${l.fx.length}</span></label>`).join("") || '<p class="muted">Açıq oyun yoxdur.</p>'}</div>`;
    $("#lgBox").querySelectorAll("input").forEach(c => c.onchange = () => { const id = +c.dataset.id; c.checked ? coupon.leagues.add(id) : coupon.leagues.delete(id); drawLoad(); build(); });
    $("#lgAll").onclick = () => { lgs.forEach(l => coupon.leagues.add(l.lg.id)); drawLg(); drawLoad(); build(); };
    $("#lgNone").onclick = () => { coupon.leagues.clear(); drawLg(); drawLoad(); build(); };
  };
  const chosen = () => open.filter(f => coupon.leagues.has(f.lg.id));
  const drawLoad = () => {
    const c = chosen(); const need = c.filter(f => !cacheGet("od:" + f.id, 90)).length; const left = Math.max(0, 100 - quota().n - RESERVE);
    $("#loadBox").innerHTML = coupon.loading ? `<div class="prog"><i id="pr"></i></div><p class="small muted" id="prT">Başlayır…</p><button class="ghost" id="stop" type="button">Dayandır</button>`
      : `<p class="small">${c.length} oyun seçilib · ${need ? `<b>${need}</b> oyunun əmsalı yüklənməlidir (~${Math.max(1, Math.ceil(Math.min(need, left) / 9))} dəq.; bu gün istifadə üçün qalıb ≈ ${left} sorğu)` : "bütün əmsallar hazırdır"}</p>
         ${need > left ? `<p class="small muted">Limit hamısına çatmır: yalnız ilk ${left} oyun yüklənəcək (vacib liqalar əvvəl).</p>` : ""}
         ${need ? `<button class="primary" id="go" type="button"${left < 1 ? " disabled" : ""}>Əmsalları yüklə</button>` : ""}`;
    const go = $("#go"); if (go) go.onclick = loadOdds;
    const st = $("#stop"); if (st) st.onclick = () => { coupon.loading = false; };
  };
  const loadOdds = async () => {
    const todo = chosen().filter(f => !cacheGet("od:" + f.id, 90)).sort((a, b) => lgRank(a) - lgRank(b)).slice(0, Math.max(0, 100 - quota().n - RESERVE)); coupon.loading = true; drawLoad(); let i = 0;
    for (const f of todo) {
      if (!coupon.loading) break;
      try { await oddsFor(f.id, w => { const t = $("#prT"); if (t) t.textContent = `Limitə görə gözlənilir (${Math.ceil(w / 1000)} san.)… ${i}/${todo.length}`; }); }
      catch (e) { coupon.loading = false; toast(errText(e), 4000); break; }
      i++; const p = $("#pr"); if (p) p.style.width = (i / todo.length * 100) + "%"; const t = $("#prT"); if (t) t.textContent = `${i} / ${todo.length} oyun`;
      if (i % 3 === 0) build();
    }
    coupon.loading = false; drawLoad(); build();
  };
  const build = () => {
    const box = $("#cpBox"); const cands = [];
    for (const f of chosen()) {
      const books = cacheGet("od:" + f.id, 90); if (!books || !Object.keys(books).length) continue;
      const A = analyze(f, books, { fast: true }); if (A.src !== "Pinnacle" && A.nBooks < 3) continue; // too thin to trust
      const ok = A.sels.filter(s => prefs.mk.includes(s.group) && s.fair >= prefs.minO && s.fair <= prefs.maxO);
      if (!ok.length) continue;
      const s = ok.sort((a, b) => b.p - a.p)[0]; cands.push({ f, s, src: A.src });
    }
    cands.sort((a, b) => b.s.p - a.s.p);
    const legs = cands.slice(0, prefs.legs); coupon.legs = legs;
    if (!legs.length) { box.innerHTML = `<div class="note">Hələ kupon üçün seçim yoxdur. Əvvəlcə əmsalları yükləyin və ya əmsal aralığını genişləndirin.</div>`; return; }
    const P = legs.reduce((a, l) => a * l.s.p, 1), F = legs.reduce((a, l) => a * l.s.fair, 1), E = legs.reduce((a, l) => a * l.s.fair * 0.94, 1);
    const oneIn = P > 0 ? Math.round(1 / P) : Infinity;
    box.innerHTML = `<div class="card"><h2>Kupon · ${legs.length} oyun</h2>
      ${legs.length < prefs.legs ? `<div class="note">İstədiyiniz ${prefs.legs} oyundan yalnız ${legs.length} uyğun seçim tapıldı. Daha çox liqa seçib əmsal yükləyin və ya əmsal aralığını genişləndirin.</div>` : ""}
      <div class="kpis"><div class="kpi"><div class="v">${P >= 0.001 ? (P * 100).toFixed(P < 0.1 ? 2 : 1) + "%" : "<0.1%"}</div><div class="k">Hamısının keçmə şansı${isFinite(oneIn) ? ` (~${oneIn.toLocaleString("az")} kupondan 1)` : ""}</div></div>
        <div class="kpi"><div class="v">${E.toFixed(E < 100 ? 2 : 0)}</div><div class="k">Etopaz-da təxmini ümumi əmsal</div></div>
        <div class="kpi"><div class="v">${(E * prefs.stake).toLocaleString("az", { maximumFractionDigits: 0 })} ₼</div><div class="k">${prefs.stake} AZN mərcə təxmini uduş</div></div></div>
      <div class="legs">${legs.map((l, i) => `<div class="leg"><span class="i">${i + 1}</span><div style="min-width:0"><div class="s">${esc(l.s.label)}</div><div class="m">${dm(l.f.ts)} ${hm(l.f.ts)} · ${esc(l.f.h.n)} – ${esc(l.f.a.n)} · ${esc(l.f.lg.n)}</div></div><div class="r"><b>${pct(l.s.p)}</b><br>min ${odd(Math.ceil(l.s.fair * 100) / 100)}</div></div>`).join("")}</div>
      <p class="small muted">Ədalətli ümumi əmsal ${F.toFixed(F < 100 ? 2 : 0)}; Etopaz hər oyunda təxminən 6% marja saxladığı üçün real əmsal aşağı olur. «min» — Etopaz-da həmin seçim üçün sərfəli minimum əmsal.</p>
      <div class="row"><button class="primary" id="cpSave" type="button">Tarixçəyə yaz</button><button class="ghost" id="cpCopy" type="button">Kopyala</button></div></div>`;
    $("#cpSave").onclick = () => { addHist({ type: "coupon", stake: prefs.stake, legs: legs.map(l => legOf(l.f, l.s, null)) }); toast("Kupon tarixçəyə yazıldı"); };
    $("#cpCopy").onclick = async () => { const t = "Kupon (" + legs.length + " oyun)\n" + legs.map((l, i) => `${i + 1}. ${l.f.h.n} – ${l.f.a.n} (${dm(l.f.ts)} ${hm(l.f.ts)}): ${l.s.label} · ${pct(l.s.p)}`).join("\n") + `\nKeçmə şansı: ${(P * 100).toFixed(2)}%`;
      try { await navigator.clipboard.writeText(t); toast("Kopyalandı"); } catch (e) { toast("Kopyalamaq olmadı"); } };
  };
  drawLg(); drawLoad(); build();
}

// ---------- history ----------
function addHist(item) { const h = ls.get(LS.hist, []); h.unshift(Object.assign({ id: Date.now().toString(36), created: Date.now() }, item)); ls.set(LS.hist, h.slice(0, 400)); }
async function checkResults(silent) {
  const h = ls.get(LS.hist, []); const now = Date.now() / 1000;
  const due = new Set(); for (const it of h) for (const l of it.legs) if (!l.res && l.ts + 2.2 * 3600 < now) due.add(l.date);
  let changed = 0, skipped = 0;
  for (const d of due) {
    if (!dateAllowed(d)) { skipped++; continue; }
    let list; try { list = await fixtures(d, true); } catch (e) { if (!silent) toast(errText(e), 4000); return; }
    const byId = new Map(list.map(f => [f.id, f]));
    for (const it of h) for (const l of it.legs) if (!l.res && l.date === d) {
      const f = byId.get(l.fid); if (!f) continue;
      if (["FT", "AET", "PEN"].includes(f.st) && f.ft && f.ft[0] != null) { const w = settle(l.key, f.ft[0], f.ft[1]); l.res = w ? "won" : "lost"; l.score = f.ft.join(":"); changed++; }
      else if (["PST", "CANC", "ABD", "AWD", "WO"].includes(f.st)) { l.res = "void"; l.score = f.st; changed++; }
    }
  }
  ls.set(LS.hist, h);
  if (!silent) toast(changed ? changed + " nəticə yeniləndi" : skipped ? "Köhnə oyunları pulsuz plan yoxlaya bilmir: nəticəni əl ilə qeyd edin" : "Yeni nəticə yoxdur", 3500);
  return changed;
}
function couponRes(it) { const r = it.legs.map(l => l.res); if (r.includes("lost")) return "lost"; if (r.every(x => x === "won" || x === "void")) return "won"; return "pending"; }
function renderHist() {
  const m = $("#main"); const h = ls.get(LS.hist, []);
  const legs = h.flatMap(it => it.legs); const done = legs.filter(l => l.res === "won" || l.res === "lost");
  const won = done.filter(l => l.res === "won").length; const expP = done.reduce((a, l) => a + l.p, 0);
  const singles = h.filter(it => it.type === "single").map(it => it.legs[0]).filter(l => l.odd && (l.res === "won" || l.res === "lost"));
  const profit = singles.reduce((a, l) => a + (l.res === "won" ? l.odd - 1 : -1), 0);
  const cps = h.filter(it => it.type === "coupon"); const cpWon = cps.filter(c => couponRes(c) === "won").length;
  m.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="v">${done.length ? Math.round(won / done.length * 100) + "%" : "–"}</div><div class="k">Düz çıxan seçimlər (${won}/${done.length})</div></div>
      <div class="kpi"><div class="v">${done.length ? Math.round(expP / done.length * 100) + "%" : "–"}</div><div class="k">Modelin gözlədiyi orta ehtimal</div></div>
      <div class="kpi"><div class="v">${singles.length ? (profit >= 0 ? "+" : "") + profit.toFixed(2) : "–"}</div><div class="k">Tək mərclər: 1 AZN-lik mərclərlə qazanc (${singles.length} mərc, Etopaz əmsalı ilə)</div></div>
      <div class="kpi"><div class="v">${cps.length ? cpWon + "/" + cps.length : "–"}</div><div class="k">Keçən kuponlar</div></div></div>
    <div class="row" style="margin-bottom:12px"><button class="primary" id="chk" type="button">Nəticələri yoxla</button>${h.length ? '<button class="ghost" id="clr" type="button">Tarixçəni sil</button>' : ""}</div>
    ${done.length >= 20 ? `<div class="note">Düz çıxma faizi modelin gözlədiyinə yaxındırsa, ehtimallar düzgün hesablanır. Daha aşağıdırsa, ehtiyatlı olun.</div>` : `<p class="small muted">Nəticələr dünənki və bugünkü oyunlar üçün avtomatik yoxlanılır (pulsuz plan daha köhnəsini vermir). Daha köhnəsini ✓/✗ ilə əl ilə qeyd edin.</p>`}
    <div id="hl">${h.length ? "" : '<p class="muted">Hələ heç nə yazılmayıb. «Oyun» və ya «Kupon» bölməsindən seçimi tarixçəyə yazın.</p>'}</div>`;
  const hl = $("#hl");
  for (const it of h) {
    const el = document.createElement("div"); el.className = "card hist-item";
    const st = it.type === "coupon" ? couponRes(it) : (it.legs[0].res || "pending");
    const lbl = { won: "Keçdi", lost: "Keçmədi", pending: "Gözləyir", void: "Ləğv" }[st];
    const P = it.legs.reduce((a, l) => a * l.p, 1);
    el.innerHTML = `<div class="top"><div><b>${it.type === "coupon" ? "Kupon · " + it.legs.length + " oyun" : "Tək seçim"}</b> <span class="small muted">${new Date(it.created).toLocaleDateString("az")}${it.type === "coupon" ? " · şans " + (P * 100).toFixed(2) + "%" : ""}</span></div><span class="badge ${st === "void" ? "pending" : st}">${lbl}</span></div>
      <div class="legs">${it.legs.map((l, i) => `<div class="leg" data-res="${l.res || ""}"><span class="i">${l.res === "won" ? "✓" : l.res === "lost" ? "✗" : i + 1}</span><div style="min-width:0"><div class="s">${esc(l.label)}</div><div class="m">${dm(l.ts)} ${hm(l.ts)} · ${esc(l.h)} – ${esc(l.a)}${l.score ? " · <b>" + esc(l.score) + "</b>" : ""}</div></div>
        <div class="r"><b>${pct(l.p)}</b>${l.odd ? "<br>Etopaz " + odd(l.odd) : ""}${!l.res ? `<br><span class="res-btns"><button type="button" data-i="${i}" data-r="won" aria-label="Düz çıxdı">✓</button><button type="button" data-i="${i}" data-r="lost" aria-label="Səhv çıxdı">✗</button></span>` : ""}</div></div>`).join("")}</div>
      <div class="row" style="margin-top:8px"><button class="ghost small" type="button" data-del>Sil</button></div>`;
    el.querySelectorAll(".res-btns button").forEach(b => b.onclick = () => { const all = ls.get(LS.hist, []); const x = all.find(y => y.id === it.id); x.legs[+b.dataset.i].res = b.dataset.r; ls.set(LS.hist, all); renderHist(); });
    el.querySelector("[data-del]").onclick = () => { if (!confirm("Bu qeydi silək?")) return; ls.set(LS.hist, ls.get(LS.hist, []).filter(y => y.id !== it.id)); renderHist(); };
    hl.append(el);
  }
  $("#chk").onclick = async () => { $("#chk").disabled = true; await checkResults(false); renderHist(); };
  const c = $("#clr"); if (c) c.onclick = () => { if (confirm("Bütün tarixçə silinsin?")) { ls.set(LS.hist, []); renderHist(); } };
}

// ---------- boot ----------
pruneCache(); showQuota(); render();
if (getKey()) setTimeout(() => checkResults(true).then(n => { if (n && tab === "hist") renderHist(); }).catch(() => {}), 1500);
</script>
</body>
</html>
